[project]
name = "chat-hub-control"
version = "0.1.0"
description = "Machine-local control-plane backend for chat-hub-alt: lets another process switch which chat a tab shows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
chat-hub-control = "chat_hub_control.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_hub_control"]
