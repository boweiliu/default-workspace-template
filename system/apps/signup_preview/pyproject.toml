[project]
name = "signup-preview"
version = "0.1.0"
description = "Live click-through preview of the sign-up plan-selector redesign"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
signup-preview = "signup_preview.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signup_preview"]
